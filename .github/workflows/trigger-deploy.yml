name: Trigger Vercel Deploy
 
on:
  push:
    branches: [ main ]
 
jobs:
  trigger-deploy:
    if: >
      !contains(github.event.head_commit.message, '[skip ci]') &&
      github.event.head_commit.author.username != github.repository_owner &&
      github.event.head_commit.author.email != '263117876+adithyarao2605@users.noreply.github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: deploy-trigger-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
 
      - name: Trigger Vercel Deploy
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "263117876+adithyarao2605@users.noreply.github.com"
          echo "$(date)" > .deploy-trigger
          git add .deploy-trigger
          git commit -m "chore: trigger deploy [skip ci]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.DEPLOY_TRIGGER_PAT }}