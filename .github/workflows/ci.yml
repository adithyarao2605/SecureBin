name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Preserve a completed audit trail for every main-branch commit. Superseded
  # pull-request runs may still be cancelled to avoid wasting runner time.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reproducibility:
    name: Reproducibility and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create isolated validation environment
        run: python -m venv .venv
      - name: Validate repository contract
        run: .venv/bin/python scripts/verify-reproducibility.py

  static-quality:
    name: Static quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      COREPACK_DEFAULT_TO_LATEST: "0"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      RATE_LIMIT_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CRON_SECRET: "test-cron-secret-1234567890123456"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Activate the package manager declared by package.json
        shell: bash
        run: |
          corepack enable
          corepack install
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          test "$(pnpm --version)" = "$expected"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run strict typecheck
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Scan source and tests for secret-bearing diagnostics
        run: pnpm audit:source
      - name: Audit production dependencies
        run: pnpm audit:prod
      - name: Build the production application
        run: pnpm build

  database:
    name: Database and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      COREPACK_DEFAULT_TO_LATEST: "0"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      RATE_LIMIT_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CRON_SECRET: "test-cron-secret-1234567890123456"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Activate the package manager declared by package.json
        run: corepack enable && corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase instance and export its runtime keys
        run: |
          supabase start
          supabase status -o env | grep '^SERVICE_ROLE_KEY=' | tr -d '"' | sed 's/^/SUPABASE_/' >> "$GITHUB_ENV"
      - name: Replay every migration from a clean database
        run: pnpm supabase:reset
      - name: Run Supabase pgTAP database tests
        run: pnpm supabase:test
      - name: Run integration tests
        run: pnpm test:integration

  browser:
    name: Development browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      COREPACK_DEFAULT_TO_LATEST: "0"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      RATE_LIMIT_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CRON_SECRET: "test-cron-secret-1234567890123456"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Activate the package manager declared by package.json
        run: corepack enable && corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase instance and export its runtime keys
        run: |
          supabase start
          supabase status -o env | grep '^SERVICE_ROLE_KEY=' | tr -d '"' | sed 's/^/SUPABASE_/' >> "$GITHUB_ENV"
      - name: Replay every migration from a clean database
        run: pnpm supabase:reset
      - name: Install the pinned browser runtimes
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e
      - name: Upload development browser results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-development
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  production-browser:
    name: Production browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: "true"
      COREPACK_DEFAULT_TO_LATEST: "0"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      RATE_LIMIT_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CRON_SECRET: "test-cron-secret-1234567890123456"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Activate the package manager declared by package.json
        run: corepack enable && corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase instance and export its runtime keys
        run: |
          supabase start
          supabase status -o env | grep '^SERVICE_ROLE_KEY=' | tr -d '"' | sed 's/^/SUPABASE_/' >> "$GITHUB_ENV"
      - name: Replay every migration from a clean database
        run: pnpm supabase:reset
      - name: Install the pinned browser runtimes
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests against the production build
        run: pnpm test:e2e:prod
      - name: Upload production browser results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-production
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  accessibility:
    name: Accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: "true"
      COREPACK_DEFAULT_TO_LATEST: "0"
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      RATE_LIMIT_HMAC_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      CRON_SECRET: "test-cron-secret-1234567890123456"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.115.0
      - name: Activate the package manager declared by package.json
        run: corepack enable && corepack install
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Start local Supabase instance and export its runtime keys
        run: |
          supabase start
          supabase status -o env | grep '^SERVICE_ROLE_KEY=' | tr -d '"' | sed 's/^/SUPABASE_/' >> "$GITHUB_ENV"
      - name: Replay every migration from a clean database
        run: pnpm supabase:reset
      - name: Install the pinned browser runtimes
        run: pnpm exec playwright install --with-deps chromium
      - name: Run accessibility tests
        run: pnpm test:a11y
      - name: Upload accessibility results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-accessibility
          path: |
            playwright-report/
            test-results/
          retention-days: 7
