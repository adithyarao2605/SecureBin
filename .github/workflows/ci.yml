name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    name: Reproducibility and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Create isolated validation environment
        run: python -m venv .venv
      - name: Validate repository contract
        run: .venv/bin/python scripts/verify-reproducibility.py

  javascript:
    name: JavaScript quality gates
    runs-on: ubuntu-latest
    if: ${{ hashFiles('package.json') != '' && hashFiles('pnpm-lock.yaml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run declared validation scripts
        run: |
          for script in lint typecheck test test:integration test:e2e test:a11y build; do
            if pnpm run | grep -q "^  ${script}"; then
              pnpm run "$script"
            else
              echo "Skipping undeclared script: $script"
            fi
          done
