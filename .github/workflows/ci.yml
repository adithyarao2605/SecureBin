name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reproducibility:
    name: Reproducibility and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Create isolated validation environment
        run: python -m venv .venv
      - name: Validate repository contract
        run: .venv/bin/python scripts/verify-reproducibility.py

  javascript:
    name: JavaScript quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      COREPACK_DEFAULT_TO_LATEST: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Activate the package manager declared by package.json
        shell: bash
        run: |
          corepack enable
          corepack install
          expected="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          test "$(pnpm --version)" = "$expected"
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run validation gate
        run: pnpm validate
      - name: Run integration tests
        run: pnpm test:integration
      - name: Install the pinned browser runtime
        run: pnpm exec playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: pnpm test:e2e
      - name: Run accessibility tests
        run: pnpm test:a11y
